<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rauiri</title>
    <link rel="icon" href="../assets/icon-32.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="workspace-heading">
        <h1 id="heading-title">Rauiri</h1>
        <button id="new-workspace-toggle" class="icon-button" type="button" aria-label="New workspace" aria-expanded="false" aria-controls="new-window-workspace" title="New workspace">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="settings" class="icon-button" type="button" aria-label="Open settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.6"/><circle cx="15" cy="17" r="2.6"/></svg>
        </button>
      </header>
      <p id="status" class="status">Finding your window…</p>
      <section>
        <form id="new-window-workspace" hidden>
          <label class="visually-hidden" for="window-name">Workspace name</label>
          <input id="window-name" autocomplete="off" placeholder="New workspace name…" required>
          <button class="primary" type="submit">Create</button>
        </form>
        <label class="search">
          <span class="visually-hidden">Find a workspace</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="window-search" type="search" autocomplete="off" placeholder="Switch to…">
        </label>
        <div id="window-list" class="window-list"></div>
        <details id="put-away-workspaces" class="disclosure" hidden>
          <summary id="put-away-summary">Put-away workspaces</summary>
          <div id="put-away-list" class="window-list"></div>
        </details>
        <div class="tab-tools"><label class="move-tab"><span>Move tab to</span><select id="window-destination"></select></label></div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
